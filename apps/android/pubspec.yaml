name: fix_happens
description: Fix Happens — cross-platform field diagnostic companion (Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/causes.json
    - assets/knowledge/
